name: Profile Cards

on:
  schedule:
    - cron: '20 2 * * *'
  push:
    branches: [main]
    paths:
      - scripts/generate_cards.py
      - .github/workflows/profile_cards.yaml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_cards.py "$RUNNER_TEMP/cards"

      # The output branch also holds the contribution snake, so its files are kept.
      - name: Publish to the output branch
        run: |
          git fetch origin output
          git checkout output
          cp "$RUNNER_TEMP"/cards/*.svg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg languages.svg streak.svg
          git diff --cached --quiet || git commit -m "Update profile cards"
          git push origin output

      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/profile_cards.yaml/enable"
